name: VALORANT Daily Shop

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"
      timezone: "Asia/Kolkata"

jobs:
  daily-shop:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create SkinPeek config
        run: |
          cat > config.json <<'EOF'
          {
            "token": "${{ secrets.SKINPEEK_TOKEN }}",
            "fetchSkinPrices": true,
            "fetchSkinRarities": true,
            "localiseSkinNames": true,
            "linkItemImage": true,
            "useEmojisFromServer": "",
            "refreshSkins": "10 0 0 * * *",
            "checkGameVersion": "*/15 * * * *",
            "cleanupAccounts": "0 * * * *",
            "delayBetweenAlerts": 5000,
            "alertsPerPage": 10,
            "emojiCacheExpiration": 10000,
            "useLoginQueue": false,
            "loginQueue": "*/2 * * * * *",
            "loginRetryTimeout": 600000,
            "useShopQueue": true,
            "shopQueue": "*/1 * * * * *",
            "storePasswords": false,
            "trackStoreStats": false,
            "statsExpirationDays": 14,
            "statsPerPage": 8,
            "ownerId": "",
            "ownerName": "",
            "status": "Up and running!",
            "logToChannel": "",
            "logFrequency": "*/10 * * * * *"
          }
          EOF

      - name: Run daily shop checker
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

          RIOT_ACCOUNT_1_COOKIES: ${{ secrets.RIOT_ACCOUNT_1_COOKIES }}
          RIOT_ACCOUNT_2_COOKIES: ${{ secrets.RIOT_ACCOUNT_2_COOKIES }}
          RIOT_ACCOUNT_3_COOKIES: ${{ secrets.RIOT_ACCOUNT_3_COOKIES }}

        run: node dailyShopCheck.js
